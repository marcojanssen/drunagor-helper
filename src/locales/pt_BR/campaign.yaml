          receber INTIMIDAR 2 (até um máximo de 4 por carta). Na próxima vez que essa
          carta for ativada, remova todos esses marcadores dela. O Ataque ativado causa
          -1 de dano por marcador removido desta forma.
      - id: well-fed
        name: Bem Alimentado
        effect: Heróis recebem apenas dois Cubos de Maldição como penalidade ao tomar
          uma Ação de Recuperação.
