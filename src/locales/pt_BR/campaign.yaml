auras:
  core:
    campaign:
      - id: blessing-of-good-fortune
        name: Bênção da boa sorte
        effect: Sempre que qualquer Herói Gastar um CA para qualquer efeito que não
          seja FADIGA (como ganhar uma Ação de Movimento adicional em um turno, por
          exemplo), ele também recupera 1 CA.
      - id: blessing-of-the-guardian
        name: Bênção do guardião
        effect: Sempre que qualquer Herói Gastar um CA para qualquer efeito que não
          seja FADIGA (como ganhar uma Ação de Movimento adicional em um turno, por
          exemplo), ele também ganha ESCUDO 2.
      - id: bloodlust
        name: Sede de sangue
        effect: "Sempre que você matar um Monstro durante seu turno: Depois de resolver
          a Ação atual, você pode tomar uma Ação com Cubo adicional. Esta habilidade
          só pode ser ativada uma vez por turno."
      - id: bonding
        name: Vínculo
        effect: Sempre que um Companheiro terminar seu turno adjacente a você, ele ganha
          ESCUDO 4.
      - id: boon-of-empathy
        name: Bênção da empatia
        effect: Como uma Ação Menor, você pode pegar um Cubo de Trauma de um Herói que
          esteja adjacente a você e colocá-lo em seu painel. Receber um Cubo de Trauma
          desta forma não encerra os efeitos desta Bênção.
      - id: boon-of-gratitude
        name: Bênção da gratidão
        effect: PREVENIR ganha um bônus de +1
      - id: brave-hearted
        name: Coração corajoso
        effect: A Escuridão sempre trata você como o Herói Mais Forte (a menos que você
          já esteja sobre a Escuridão) e você não recebe dano da Escuridão.
      - id: clear-conscious
        name: Consciência limpa
        effect: "Sempre que você matar uma criatura com um ataque (Mágico ou de Arma),
          você ganha: EM SI, PURIFICAR 1."
      - id: cold-hearted
        name: Coração frio
        effect: A Escuridão sempre trata você como o Herói Mais Forte (a menos que você
          já esteja sobre a Escuridão) e, enquanto você estiver sobre a Escuridão, sempre
          que acertar um Monstro com um Ataque de Arma ou Ataque Mágico pela primeira
          vez durante seu turno, esse ataque causa +2 de dano.
      - id: disdained
        name: Desprezado
        effect: Sempre que você tomar uma Ação de Recuperação, sofre FADIGA 1 após resolvê-la.
      - id: determined
        name: Determinado
        effect: Você é imune a LENTO e ATORDOAR.
      - id: grandeur
        name: Grandeza
        effect: "Sempre que qualquer Herói obtiver um Acerto Crítico, ele ganha: EM SI,
          PURIFICAR 2."
      - id: hellbent
        name: Obstinado
        effect: Sempre que qualquer Herói obtiver um Acerto Crítico, o ataque ganha
          +1 DANO (não dobre por causa do crítico) por Cubo de Maldição que aquele Herói
          estiver mantendo.
      - id: inspiring-leadership
        name: Liderança inspiradora
        effect: Todos os Heróis do grupo obtêm um Acerto Crítico em vez de uma Falha
          Crítica sempre que rolarem 1 no d20.
      - id: intoxicated
        name: Intoxicado
        effect: Sempre que você tomar uma Ação de Recuperação, sofre VENENO 4.
      - id: murderous-intent
        name: Intenção assassina
        effect: "Sempre que você matar uma criatura com um Ataque (Mágico ou de Arma),
          você ganha: EM SI, FOCO 1."
      - id: over-the-edge
        name: No limite
        effect: "Sempre que qualquer Herói obtiver um Acerto Crítico, ele ganha: EM SI,
          FOCO 1."
      - id: soulmates-reunited
        name: Almas gêmeas reunidas
        effect: Sempre que você rolar 1 no d20, obtém um Acerto Crítico em vez de uma
          Falha Crítica e ganha FOCO 2.
      - id: spellshock
        name: Choque mágico
        effect: Sempre que você tomar uma Reação, sofre FADIGA 1.
      - id: true-hearted-blessing
        name: Bênção do coração verdadeiro
        effect: Sempre que qualquer Herói Gastar um CA para qualquer efeito que não
          seja FADIGA (como ganhar uma Ação de Movimento adicional em um turno, por
          exemplo), ele também ganha FOCO 1.
      - id: well-meaning
        name: Bem intencionado
        effect: Sempre que você usar um efeito de PURIFICAR em qualquer Herói, aquele
          Herói também pode Recuperar até um Cubo de Ação.
    storyrecord: []
  apocalypse:
    campaign:
      - id: brute-force
        name: Força Bruta
        effect: "Como uma Ação Menor, você pode Gastar 1 CA para: EM SI, FORTALECER."
      - id: burden-of-guilt
        name: Fardo da Culpa
        effect: "Sempre que você tomar uma Ação de Recuperação: Você sofre INTIMIDAR
          4. Este INTIMIDAR ignora qualquer tipo de imunidade que seu Herói possa ter."
      - id: dried-tears
        name: Lágrimas Secas
        effect: "Sempre que você tomar uma Ação de Recuperação: Você recebe PURIFICAR
          1."
      - id: grievous-wound
        name: Ferida Grave
        effect: "Sempre que você tomar uma Ação de Recuperação: Você sofre SANGRAMENTO
          4. Este SANGRAMENTO ignora qualquer tipo de imunidade que seu Herói possa
          ter."
      - id: helpful
        name: Prestativo
        effect: "Sempre que você derrotar um Monstro (você deve ser aquele a desferir
          o golpe final): EM SI, INSPIRAR."
      - id: inobtrusive
        name: Discreto
        effect: Um Monstro não pode atacar você a menos que você ou um NPC de seu grupo
          (seus Mascotes incluídos) já os tenham atacado ou os tenham afetado com um
          efeito de qualquer tipo.
      - id: justiciar
        name: Justiceiro
        effect: Sempre que um Herói tomar uma Ação de Recuperação, após resolvê-la,
          esse Herói recebe PURIFICAR 1 ou FOCO 1.
      - id: last-stand
        name: Último Suporte
        effect: Sempre que você fosse cair a 0 de Vida, faça um Teste de Habilidade
          de Força (amarelo) de Dificuldade 11. Cada cubo Corpo a corpo que você tem
          concede um bônus de +2 à sua rolagem. Além disso, cada Estado “Esforço” que
          você tem anotado em seu Registro de Campanha carrega uma penalidade de -5
          à sua rolagem. Se tiver sucesso, você cai a 1 de Vida e anota um Estado “Esforço”
          em seu Registro de Campanha. Se falhar, você é Nocauteado normalmente (o que
          fará com que esta Aura seja removida de seu Registro de Campanha).
      - id: like-water
        name: Como Água
        effect: "Como uma Ação Menor, você pode Gastar 1 CA para: EM SI, ESCUDO 4."
      - id: overwhelming-power
        name: Poder Avassalador
        effect: "Como uma Ação Menor você pode Gastar 1 CA para: Alcance 1, Ataque Mágico
          de 4 DANO."
      - id: peace-broker
        name: Mediador de Paz
        effect: Sempre que um Herói tomar uma Ação de Recuperação, após resolvê-la,
          esse Herói ganha ESCUDO 4.
      - id: steadfast
        name: Firme
        effect: Sempre que um Herói tomar uma Ação de Recuperação, esse Herói ganha
          FOCO 2.
      - id: stern
        name: Severo
        effect: "Sempre que um Monstro atacar você: antes de sofrer qualquer dano, você
          ganha ESCUDO 1."
    storyrecord: []
  awakenings:
    campaign:
      - id: ancient-spell
        name: Feitiço Antigo
        effect: No início de seu turno, você ganha ESCUDO 1.
      - id: bastion
        name: Bastião
        effect: Você não pode ser PISOTEADO por Devastadores Vis.
      - id: blessing-of-prosperity
        name: Bênção da Prosperidade
        effect: Sempre que você comprar uma carta de Baú, compre uma carta de Baú adicional
          e escolha uma dentre elas para manter.
      - id: calm-mind
        name: Mente Calma
        effect: Sempre que qualquer Herói receber um efeito de PURIFICAR, ele RECUPERA
          2 DE VIDA.
      - id: city-hero
        name: Herói da Cidade
        effect: Sempre que você tomar uma Ação de Recuperação, faça um Teste de Habilidade
          de Sabedoria (azul) de Dificuldade 13. Cada cubo de Sabedoria que você tem
          lhe dá um bônus de +2 à sua rolagem. Se Suceder, evite a Penalidade de Cubo
          de Maldição que você receberia. Caso contrário, sofre a Penalidade de Cubo
          de Maldição normalmente.
      - id: critical-movements
        name: Movimentos Críticos
        effect: Ataques de Arma que você fizer ganham AGUÇADO.
      - id: dour
        name: Sombrio
        effect: Se nenhum aliado estiver adjacente a você, seus Ataques de Arma ganham
          um bônus de +2 no ACERTO e seus Ataques Mágicos ganham um bônus de +1 DANO.
      - id: dragon-s-breath
        name: Sopro do Dragão
        effect: Sempre que você tomar uma Ação de Recuperação, você arrota fogo, pegando
          um Cubo de Maldição adicional (num total de dois) e escolhendo uma área (quadrado
          azul) dentro do Alcance 1 para infligir QUEIMADURA 4 em cada Personagem nela.
          Cada um dos outros Heróis que não foi pego pelo fogo acha isso hilário e recebe
          um marcador de INSPIRAÇÃO.
      - id: fainted-memoir
        name: Memória Vacilante
        effect: Sempre que um Herói tomar uma Ação de Recuperação, ele ganha um marcador
          de INSPIRAÇÃO e recebe FORTALECER.
      - id: fighting-back
        name: Contra-Ataque
        effect: Sempre que qualquer Herói tomar uma Interrupção ou uma Reação para responder
          a um ataque, o atacante sofre 1 de dano não prevenível.
      - id: fighting-spirit
        name: Espírito de Luta
        effect: "Sempre que um Monstro for morto: Em Si, Recupere 1 de Vida"
      - id: gold-digger
        name: Garimpeiro
        effect: Sempre que você vasculhar um Baú ou pegar um Saque, você compra as duas
          cartas do topo do baralho de Baú, escolhe uma delas para manter e descarta
          a outra em vez de apenas comprar a carta do topo.
      - id: heroic-resolution
        name: Resolução Heroica
        effect: Sempre que um Herói fosse ser Nocauteado pelo dano de um ataque, ele
          pode fazer um Teste de Habilidade de Força (amarelo) de dificuldade 13. Cada
          cubo Corpo a corpo que ele tem lhe dá um bônus de +2 à sua rolagem. Se tiver
          sucesso, ele cai a 1 de Vida em vez disso. Se falhar, ele é Nocauteado normalmente.
      - id: hurry-up
        name: Depressa
        effect: Sempre que qualquer Herói Gastar 1 CA para tomar uma Ação de Movimento
          Adicional em um turno, essa Ação de Movimento Adicional ganha +1 MOVIMENTO
          e PISOTEAR 2.
      - id: inspired
        name: Inspirado
        effect: Uma vez por turno e apenas durante seu turno, você pode rerrolar um
          d20 que acabou de rolar se não gostou do resultado.
      - id: inspiring-presence
        name: Presença Inspiradora
        effect: Ataques de Arma feitos por qualquer Herói dentro do Alcance 1 dele ganham
          um Bônus de +1 PARA ACERTAR.
      - id: kitten-chaser
        name: Perseguidor de Gatinhos
        effect: Sempre que você Gastar 1 CA para tomar uma Ação de Movimento adicional
          (isto não inclui nenhuma Habilidade de Agilidade ou sua Ação de Movimento
          Grátis), você ganha FOCO 2.
      - id: lone-wolf
        name: Lobo Solitário
        effect: Enquanto nenhum outro aliado estiver adjacente a você (Heróis, Camaradas
          e Mascotes são aliados), sempre que você tomar uma Interrupção ou uma Reação
          contra um ataque ou ameaça gerada por um Monstro, o monstro atacante sofre
          2 de DANO não prevenível.
      - id: moves-like-jagger
        name: Se Move Como Jagger
        effect: Sempre que você tomar uma Reação, também tenha como Alvo Outro Herói,
          INSPIRAR.
      - id: obscure-lore
        name: Saber Obscuro
        effect: Efeitos de FOCO que você conjurar ganham um Bônus de +1.
      - id: prohibition
        name: Proibição
        effect: Cada Herói pode, uma vez por turno, pegar um Cubo de Maldição para rerrolar
          um d20 que acabou de rolar cujo resultado não gostou.
      - id: protector
        name: Protetor
        effect: Efeitos de PREVENIR que qualquer Herói conjurar ganham um BÔNUS de +1.
      - id: reckless-revenge
        name: Vingança Imprudente
        effect: Sempre que você perder 1 ou mais de Vida, ganha FOCO 1 (sofrer dano
          causa perda de vida).
      - id: sentinel
        name: Sentinela
        effect: "Sempre que um Personagem aliado adjacente a você for atacado, como
          uma Interrupção, você pode Gastar 1 Cubo de Ação para fazer um Ataque de Arma
          de +0 ACERTO contra o Monstro que o está atacando, se esse Monstro também
          estiver no Alcance de sua arma. Se esse Monstro for derrotado por seu ataque,
          cancele seu ataque atual: ele não causará dano a nenhum de seus alvos. NOTA:
          Se você tomar uma Interrupção contra o ataque de um Monstro, não pode também
          tomar Reações contra nenhuma ameaça gerada por esse mesmo ataque."
      - id: setting-sun-s-blessing
        name: Bênção do Sol Poente
        effect: "Heróis acertam com Ataque de Arma e têm sucesso com Testes de Habilidade
          sempre que rolarem 1 no d20. Além disso, sempre que um Herói conjurar um efeito
          de Ataque Mágico, ele deve rolar o d20: se rolar 16+, esse Ataque Mágico é
          um Acerto Crítico (causa o dobro do dano que normalmente causaria)."
      - id: sisters-bond
        name: Laço de Irmãs
        effect: Sempre que outro Herói dentro do Alcance 1 fosse sofrer dano ou receber
          um Cubo de Maldição, você pode sofrer esse dano ou receber esse Cubo de Maldição
          em seu lugar. Se o fizer, sente-se recompensado e ganha um marcador de INSPIRAÇÃO.
      - id: taunt
        name: Provocação
        effect: "Sempre que seus aliados no Alcance 1 forem atacados, você pode sofrer
          FADIGA 1 para: COBRIR o ALIADO alvo (se dois ou mais aliados estiverem sendo
          atacados ao mesmo tempo, você só pode Cobrir um deles). Cobrir um Alvo desta
          forma não requer ação e é feito na velocidade de uma Interrupção, mas não é
          considerado uma Interrupção."
      - id: throat-slitter
        name: Cortador de Gargantas
        effect: "Sempre que você desferir um Golpe Mortal: você ganha FOCO 1. Este efeito
          só pode ser ativado uma vez por turno."
      - id: truthful
        name: Verdadeiro
        effect: Você só recebe um Cubo de Maldição ao tomar Ações de Recuperação.
      - id: uncertain-readings
        name: Leituras Incertas
        effect: Heróis podem pegar um Cubo de Maldição e sofrer FRÁGIL para transformar
          um Teste de Precisão que acabaram de errar em um sucesso.
      - id: valorous-party
        name: Grupo Valoroso
        effect: Sempre que um Herói obtiver um Acerto Crítico, esse Herói pode ganhar
          à sua escolha FOCO 1 ou PURIFICAR 1
      - id: vision-beyond-reach
        name: Visão Além do Alcance
        effect: Todos os Ataques de Arma à Distância que você fizer e efeitos à Distância
          que você conjurar ganham +1 de ALCANCE. Então, você pode continuar a jogar
          a Aventura
    storyrecord: []
statuses:
  core:
    campaign:
      - id: a-cooperative-approach
        name: Uma abordagem cooperativa
        effect: Sempre que um Herói vasculhar um Baú, ele pode comprar uma carta adicional
          e escolher uma das duas que comprou para manter. Ele deve embaralhar a outra
          carta de volta no baralho.
      - id: a-friendly-approach
        name: Uma abordagem amigável
        effect: Sempre que qualquer Herói resolver um efeito com a palavra-chave 'EM
          SI', ele pode escolher outro personagem que esteja adjacente a ele como seu
          alvo em vez de si mesmo.
      - id: aggressive-approach
        name: Abordagem agressiva
        effect: "Como uma Ação Menor, você pode: EM SI, MALDIÇÃO 1 para desinvocar uma
          Assombração do Rei Morto-Vivo."
      - id: a-man-s-best-friend
        name: O melhor amigo do homem
        effect: ""
      - id: a-mysterious-click
        name: Um clique misterioso
        effect: ""
      - id: apathetic
        name: Apático
        effect: ""
      - id: a-suspicious-approach
        name: Uma abordagem suspeita
        effect: Todos os Baús são considerados seguros e os Heróis não precisam rolar
          o dado de Armadilha ao vasculhá-los.
      - id: battlefield-medic
        name: Médico de campo
        effect: "Como uma Ação com Cubo, você pode: Gastar 1 CA enquanto adjacente a
          um Herói Nocauteado para remover o Cubo de Trauma que ele acabou de receber
          de seu painel (esta ação não pode remover um Cubo de Trauma de um Herói depois
          que ele recuperou o fôlego)."
      - id: beheaded
        name: Decapitado
        effect: ""
      - id: blessed-source
        name: Fonte abençoada
        effect: Você não recebe nenhum Cubo de Maldição ao tomar uma Ação de Recuperação.
      - id: bloodlust
        name: Sede de sangue
        effect: Sempre que você matar um Monstro durante seu turno, depois de resolver
          a Ação atual, você pode tomar uma Ação com Cubo adicional. Este efeito só
          pode ser ativado uma vez por turno. Caso contrário, se nenhum Herói o tiver,
          você ganha FOCO 2.
      - id: blue-flame
        name: Chama azul
        effect: Você não sofre dano da Escuridão.
      - id: bookworm
        name: Rato de biblioteca
        effect: Sempre que você tomar uma Ação de Recuperação durante seu turno, você
          pode recuperar uma carta de Pergaminho da pilha de descarte do baralho de
          Baú e usá-la imediatamente. Isso não conta como uma Ação Menor de “Usar Item
          Consumível”. Se o fizer, após resolver aquela carta, embaralhe-a de volta
          no baralho de Baú em vez de colocá-la novamente na pilha de descarte.
      - id: bullied
        name: Intimidado
        effect: Sempre que você rolar 5 ou menos no d20, você obtém uma falha crítica.
