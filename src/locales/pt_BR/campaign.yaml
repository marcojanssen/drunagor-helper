      - id: haunted
        name: Assombrado
        effect: Sempre que você rolar 1 no d20 ao atacar, se um Aliado estiver no Alcance
          do ataque, ele é atingido em vez de um Monstro (isso acontece mesmo que você
          tenha habilidades que transformam rolagens de 1 em acertos ou acertos críticos).
      - id: lifesaver
        name: Salva-vidas
        effect: Como uma Ação com Cubo, você pode Gastar 1 Cubo de Ação para pegar 2
          Cubos de Maldição (pegar um Cubo de Maldição é diferente de sofrer MALDIÇÃO)
          e remover um Cubo de Trauma de um Herói Nocauteado que esteja adjacente a
          você. Se esse Herói já tiver Recuperado o Fôlego, você não pode remover seu
          Cubo de Trauma desta forma.
      - id: power-of-hate
        name: Poder do Ódio
        effect: Heróis podem tomar 1 Ação com Cubo adicional em seus turnos.
      - id: shadow-crown
        name: Coroa das Sombras
        effect: Heróis não são afetados pela Escuridão (não sofrem nem o dano nem as
          penalidades).
      - id: soft-heart
        name: Coração Mole
        effect: Enquanto houver outro Herói adjacente a você, esse Herói receberá os
          benefícios da Aura "Sombrio" (os benefícios da Aura só se aplicam enquanto
          você ainda estiver adjacente a ele).
      - id: sweet-scent
        name: Aroma Doce
        effect: Lacaios são enfeitiçados por seu cheiro agradável e são incapazes de
          atacar você (não consideram você como um alvo) e o Javali Selvagem que perambula
          pela ilha (se ainda estiver vivo) não tentará mais escapar. Em vez disso,
          ele se moverá em sua direção, tentando permanecer adjacente a você.
